- name: configure shipping server
  hosts: shipping
  become: yes
  tasks:
  - name: enable maven 3.9
    command: dnf install maven java-25-openjdk-devel -y

  - name: install maven and java-25 
    dnf:
      name:
      - maven
      - java-25-openjdk-devel
      state: present

  - name: find java 25 path
    shell: readlink -f $(ls /usr/lib/jvm/java-25-openjdk*/bin/java | head -1)
    register: java25 


  - name: print java version 
    debug:
      msg: "{{ java25 }}"

  - name: make java 25 as default
    command: alternatives --set java {{ java25.stdout }}

  - name: set JAVA_HOME
    copy:
      content: "eport JAVA_HOME={{ java25.stdout | dirname | dirname }}"
      dest: /etc/profile.d/java.sh

  - name: create roboshop system user
    user:
      name: robosshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/nologin
      comment: "robohop system user"

  - name: remove existing app directory
    file: 
      path: /app
      state: absent

  - name: remove shipping.zip
    file: 
      path: /tmp/shipping.zip
      state: absent

  - name: create app directory
    file: 
      path: /app
      state: directory

  - name: download shipping application
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
      dest: /tmp/shipping.zip

  - name: unzip shipping
    unarchive:
      src: /tmp/shipping.zip
      dest: /app
      remote_src: yes

  - name: install dependencies
    command: mvn clean package
    args:
      chdir: /app

    environment:
      JAVA_HOME: "{{ java25.stdout | dirname | dirname }}"
      MAVEN_OPTS: "-Djdk.tls.namedGroups=\"secp256r1,secp384r1,ffdhe2048\""