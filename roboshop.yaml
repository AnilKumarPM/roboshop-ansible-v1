- name: create ec2 instances and route53 records
  hosts: local
  connection: local
  vars:
    instances: [ "mongodb","redis","mysql","rabbitmq"]
    action: create
    domain_name: aaws.online
    ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      security_groups:
      - roboshop-common
      - roboshop-{{ item }}
    loop: "{{ instances }}"
    